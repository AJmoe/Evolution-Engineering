# Local development: `docker compose up` gives a working site with seed data at http://localhost:8080
# Mail sent by the site is caught by Mailpit at http://localhost:8025
services:
  php:
    build: ./docker/php
    volumes:
      - ./:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: evolution_engineers
      DB_USER: ee
      DB_PASS: ee
      MAIL_HOST: mail
      MAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             php database/migrate.php --seed &&
             php-fpm"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: evolution_engineers
      MARIADB_USER: ee
      MARIADB_PASSWORD: ee
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  dbdata:
