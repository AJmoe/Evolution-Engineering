# Apache site for the Render image. Listens on $PORT, which Render sets (default 10000).
Listen ${PORT}
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Only index.php is executable; dotfiles are never served.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Hashed build assets never change, so cache them for a year.
    <Directory /var/www/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
