server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # Only index.php is executable; deny everything else ending in .php and all dotfiles.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}
